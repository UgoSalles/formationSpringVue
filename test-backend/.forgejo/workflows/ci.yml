name: CI

on:
  pull_request:
    branches: [main, stable]

jobs:
  backend:
    runs-on: docker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # verify enchaîne spring-javaformat (format), Checkstyle, SpotBugs, tests unitaires + intégration (H2 en mémoire)
      - name: Backend — verify
        run: mvn -B -f pom.xml verify
